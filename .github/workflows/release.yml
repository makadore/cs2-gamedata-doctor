name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            file: gamedata-doctor
            asset: gamedata-doctor-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: gamedata-doctor.exe
            asset: gamedata-doctor-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # a tag can be pushed on any commit: the release checks what CI checks, itself
      - name: Format and lint
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Name the binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.file }} ${{ matrix.asset }}
      - name: Checksum
        shell: bash
        run: sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
